name: Build and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure
      - name: Stage executables
        run: cmake --install build --config Release --prefix package
      - name: Archive executables and documentation
        run: cmake -E tar cfv file-transfer-${{ runner.os }}.zip --format=zip package/bin README.md LICENSE docs/protocol.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: file-transfer-${{ runner.os }}
          path: file-transfer-${{ runner.os }}.zip
          if-no-files-found: error
